spring.application.name=travelmate
server.port=8080

# ---------- Base de donnees ----------
# Une seule base MySQL (XAMPP) partagee par les 6 modules.
# La base "travelmate" est creee automatiquement au premier lancement.
spring.datasource.url=jdbc:mysql://localhost:3306/travelmate?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Hibernate cree / met a jour les tables a partir des entites
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Pas de MySQL sur votre PC ? Lancez avec la base H2 en memoire (voir application-h2.properties) :
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2

# ---------- JWT ----------
# Cle secrete (au moins 32 caracteres). A changer en production.
jwt.secret=TravelMate-Groupe6-cle-secrete-jwt-2026-tres-longue
# Duree de validite du jeton : 24 h
jwt.expiration-ms=86400000

# ---------- IA : Ollama en local ----------
ollama.url=http://localhost:11434
ollama.model=llama3

# ---------- Module 3 : destinations et activites ----------
# Client Ollama du module 3 (recommandation des activites) ; ollama.model est deja defini plus haut
ollama.base-url=http://localhost:11434
ollama.timeout-seconds=90

# ---------- Module 5 : hebergements ----------
# Cree ~42 hebergements de demonstration au premier lancement (seulement si la table est vide)
travelmate.accommodation.seed.enabled=true
# IA du juste prix (llama3 local) ; enabled=false pour utiliser seulement le calcul statistique
travelmate.ai.ollama.enabled=true
travelmate.ai.ollama.base-url=http://localhost:11434
travelmate.ai.ollama.model=llama3
# Cache des analyses de prix (evite de rappeler l'IA pour le meme hebergement)
spring.cache.cache-names=priceAnalysis
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=30m
# Documentation de l'API : http://localhost:8080/swagger-ui.html
